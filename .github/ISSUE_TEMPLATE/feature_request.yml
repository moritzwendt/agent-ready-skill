name: Feature request
description: Suggest a new behavior or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or annoying today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the skill do instead?
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Agents this affects
      placeholder: All, or for example Cursor and Codex
