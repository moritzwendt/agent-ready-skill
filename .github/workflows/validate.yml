name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: pip install skills-ref
      - name: Validate skill format
        run: agentskills validate skills/agent-ready
      - name: Repository checks
        run: python .github/scripts/check.py

  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md has an entry
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -qx CHANGELOG.md; then
            echo "Add an entry to CHANGELOG.md under Unreleased, or add the skip-changelog label."
            exit 1
          fi
